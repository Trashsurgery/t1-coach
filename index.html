/* ==========================================================================
   T1 Practice Coach
   Visual language borrowed from the instrument itself: a dark anodised panel,
   narrow silkscreen lettering, grey secondary-function labels, and the T1
   LED colour code used semantically throughout.
   Dark-first: bare :root carries the dark palette; light is the swap.
   ========================================================================== */

:root {
  /* --- ground & structure (near-black with a faint blue bias) --- */
  --ink:        #0c0d10;
  --panel:      #14161b;
  --panel-2:    #1b1e25;
  --panel-3:    #232732;
  --line:       #2a2e38;
  --line-soft:  #1f232b;

  /* --- lettering --- */
  --text:       #e9e7e2;   /* warm off-white, like panel paint */
  --text-2:     #b6b8bd;
  --dim:        #868a93;   /* the grey secondary-function silkscreen */
  --dim-2:      #5d626c;

  /* --- the instrument LED palette --- */
  --led-orange:  #ff7a18;  /* selected note track, home colour, accent */
  --led-amber:   #f2c230;  /* bank edited / not saved  -> needs work */
  --led-green:   #3ecf6e;  /* bank saved               -> done */
  --led-cyan:    #24d1d8;  /* CC track */
  --led-magenta: #c45cff;  /* FX track */
  --led-red:     #ff3b30;  /* retrigger, cycle edit, clear */
  --led-white:   #f2f4f7;  /* selected pattern */
  --led-blue:    #3f6fd8;  /* muted track */

  --accent:      #ff7a18;
  --accent-ink:  #1a0c02;

  --glow:       0 0 0 1px rgba(255,122,24,.35), 0 0 18px -6px rgba(255,122,24,.5);
  --shadow:     0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -18px rgba(0,0,0,.9);
  --modalshadow: 0 30px 80px -20px rgba(0,0,0,.85);
  --scrim:      rgba(4,5,7,.72);
  --railshadow: 0 0 60px rgba(0,0,0,.6);

  --rail-w: 268px;
  --measure: 68ch;

  --f-display: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  --f-body:    "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ink:       #f4f3f0;
    --panel:     #ffffff;
    --panel-2:   #f8f7f4;
    --panel-3:   #ecebe6;
    --line:      #d6d3cc;
    --line-soft: #e7e4de;

    --text:      #16181c;
    --text-2:    #3e424a;
    --dim:        #696e77;
    --dim-2:     #8e949e;

    --led-orange:  #c44f07;
    --led-amber:   #8f6505;
    --led-green:   #137740;
    --led-cyan:    #08737a;
    --led-magenta: #7a2bba;
    --led-red:     #bf2117;
    --led-white:   #2a2d33;
    --led-blue:    #24499b;

    --accent:     #c44f07;
    --accent-ink: #fff6ee;

    --glow:   0 0 0 1px rgba(196,79,7,.3), 0 0 16px -8px rgba(196,79,7,.4);
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 8px 24px -18px rgba(0,0,0,.35);
    --modalshadow: 0 26px 70px -22px rgba(0,0,0,.35);
    --scrim:  rgba(30,28,24,.42);
    --railshadow: 0 0 60px rgba(0,0,0,.18);
  }
}

:root[data-theme="light"] {
  --ink:       #f4f3f0;
  --panel:     #ffffff;
  --panel-2:   #f8f7f4;

  --glow:   0 0 0 1px rgba(196,79,7,.3), 0 0 16px -8px rgba(196,79,7,.4);
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 8px 24px -18px rgba(0,0,0,.35);
  --modalshadow: 0 26px 70px -22px rgba(0,0,0,.35);
  --scrim:  rgba(30,28,24,.42);
  --railshadow: 0 0 60px rgba(0,0,0,.18);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--f-display);
  font-weight: 600;
  line-height: 1.15;
  text-wrap: balance;
  margin: 0;
}

p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

::selection { background: var(--accent); color: var(--accent-ink); }

.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.eyebrow {
  font-family: var(--f-display);
  font-weight: 600; font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim);
}

/* ==========================================================================
   Shell
   ========================================================================== */

.app { display: flex; min-height: 100%; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  background: var(--ink);
  border-bottom: 1px solid var(--line-soft);
}

.brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; min-width: 0; }
.brand__t1 {
  font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: .06em;
  color: var(--accent-ink); background: var(--accent);
  padding: 2px 6px 3px; border-radius: 3px; flex: none;
}
.brand__name {
  font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .02em;
  white-space: nowrap;
}
.brand__sub {
  font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
@media (max-width: 1180px) { .brand__sub { display: none; } }
@media (max-width: 620px)  { .brand__name { display: none; } }

/* Phones: five tools plus the badge are wider than a 375px screen at desktop
   sizing. Tighten them, and let the bar wrap rather than push the page sideways. */
.topbar { flex-wrap: wrap; row-gap: 8px; }
@media (max-width: 520px) {
  .topbar { gap: 6px; padding: 8px 12px; }
  .topbar .tool { padding: 5px 8px; font-size: 11.5px; letter-spacing: .03em; }
}
@media (max-width: 400px) {
  .brand__t1 { display: none; }
}

.tool {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px;
  font-family: var(--f-display); font-size: 12.5px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-2);
  border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel);
  white-space: nowrap;
}
.tool:hover { color: var(--text); border-color: var(--dim-2); }
.tool[aria-pressed="true"], .tool.is-on {
  color: var(--accent); border-color: var(--accent);
}
.tool kbd {
  font-family: var(--f-mono); font-size: 10px; color: var(--dim);
  border: 1px solid var(--line); border-radius: 3px; padding: 0 3px;
}

/* ---------- left rail ---------- */
.rail {
  flex: 0 0 var(--rail-w);
  width: var(--rail-w);
  border-right: 1px solid var(--line-soft);
  background: var(--panel);
  display: flex; flex-direction: column;
  position: sticky; top: 0; align-self: flex-start;
  height: 100vh; overflow-y: auto;
  overscroll-behavior: contain;
}

.rail__head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line-soft); }

.overall { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.overall__pct {
  font-family: var(--f-display); font-weight: 700; font-size: 30px;
  letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--text);
}
.overall__of { font-size: 12.5px; color: var(--dim); }

.meter { height: 4px; border-radius: 99px; background: var(--panel-3); overflow: hidden; display: flex; }
.meter__done { background: var(--led-green); }
.meter__work { background: var(--led-amber); }

.rail__list { list-style: none; margin: 0; padding: 8px 0 24px; }

.unitbtn {
  display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px;
  width: 100%; text-align: left;
  padding: 9px 18px 10px;
  border-left: 2px solid transparent;
}
.unitbtn:hover { background: var(--panel-2); }
.unitbtn[aria-current="true"] { background: var(--panel-2); border-left-color: var(--accent); }
.unitbtn__n {
  grid-row: 1 / span 2;
  font-family: var(--f-mono); font-size: 11px; font-weight: 500;
  color: var(--dim-2); padding-top: 3px; font-variant-numeric: tabular-nums;
}
.unitbtn[aria-current="true"] .unitbtn__n { color: var(--accent); }
.unitbtn__t {
  font-family: var(--f-display); font-weight: 600; font-size: 14px;
  letter-spacing: .01em; color: var(--text-2);
}
.unitbtn[aria-current="true"] .unitbtn__t, .unitbtn:hover .unitbtn__t { color: var(--text); }
.unitbtn__m { display: flex; align-items: center; gap: 7px; }
.unitbtn__m .meter { flex: 1; height: 3px; }
.unitbtn__c {
  font-family: var(--f-mono); font-size: 10px; color: var(--dim-2);
  font-variant-numeric: tabular-nums;
}
.unitbtn.is-complete .unitbtn__c { color: var(--led-green); }

.rail__foot {
  margin-top: auto; padding: 14px 18px 20px;
  border-top: 1px solid var(--line-soft);
  display: flex; flex-direction: column; gap: 8px;
}
.rail__foot .tool { justify-content: center; }
.provenance { font-size: 11.5px; line-height: 1.5; color: var(--dim-2); }

.warnnote {
  font-size: 11.5px; line-height: 1.5;
  color: var(--led-amber);
  border: 1px solid var(--led-amber);
  border-radius: 4px;
  padding: 8px 10px;
  background: var(--panel-2);
}

.railtoggle { display: none; }
.scrim { display: none; }

@media (max-width: 900px) {
  .app { display: block; }
  .railtoggle { display: inline-flex; }
  /* Drawer slides on `left` rather than a transform: the layout position is
     honoured by every renderer, and 340px clears the 320px maximum width. */
  .rail {
    position: fixed; top: 0; bottom: 0; left: -340px; z-index: 60;
    height: 100%; width: min(84vw, 320px); flex-basis: auto;
    transition: left .22s ease;
    box-shadow: var(--railshadow);
  }
  .rail.is-open { left: 0; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 50; background: var(--scrim); }
}

/* ---------- main ---------- */
.main { flex: 1 1 auto; min-width: 0; }
.wrap { padding-left: 18px; padding-right: 18px; padding-bottom: 96px; }
.wrap > * { max-width: var(--measure); }
.wrap > .bleed { max-width: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

/* ==========================================================================
   Panel notation chips
   ========================================================================== */

.chip {
  display: inline-flex; align-items: center;
  font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .02em;
  padding: 1px 5px 2px;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text-2);
  white-space: nowrap; vertical-align: baseline;
}
.chip--btn  { color: var(--led-white); border-color: var(--dim-2); }
.chip--knob { color: var(--led-cyan);  border-color: var(--led-cyan); }
.chip--vb   { color: var(--led-orange); border-color: var(--led-orange); }
.chip--ctrl { color: var(--dim); border-style: dashed; }
.chip--val  { color: var(--text); background: var(--panel-3); font-variant-numeric: tabular-nums; }
.chip--plus { border: 0; background: none; color: var(--dim-2); padding: 0 1px; }

.gesture { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }

/* ==========================================================================
   Unit view
   ========================================================================== */

.unithead { padding-top: 30px; padding-bottom: 22px; }
.unithead__n {
  font-family: var(--f-mono); font-size: 12px; color: var(--accent);
  letter-spacing: .08em; text-transform: uppercase;
}
.unithead h2 { font-size: clamp(26px, 5vw, 34px); letter-spacing: -.012em; margin: 6px 0 10px; }
.unithead__tag { color: var(--dim); font-size: 14px; }
.unithead__intro {
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--line-soft);
  color: var(--text-2); font-size: 15.5px;
}

.unitmeter { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
.unitmeter .meter { flex: 1; height: 5px; }
.unitmeter__c {
  font-family: var(--f-mono); font-size: 11.5px; color: var(--dim);
  font-variant-numeric: tabular-nums; letter-spacing: .03em;
}

.checklist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }

.item {
  border-bottom: 1px solid var(--line-soft);
  border-left: 2px solid var(--line);
  padding: 15px 0 15px 16px;
  display: grid; grid-template-columns: 24px 1fr; gap: 4px 13px;
  align-items: start;
  transition: border-color .15s ease;
}
.item.is-done      { border-left-color: var(--led-green); }
.item.is-needswork { border-left-color: var(--led-amber); }

.tick {
  grid-row: 1 / span 3;
  width: 22px; height: 22px; margin-top: 1px;
  border: 1.5px solid var(--dim-2); border-radius: 4px;
  display: grid; place-items: center;
  color: transparent;
}
.tick:hover { border-color: var(--text-2); }
.tick svg { width: 13px; height: 13px; }
.item.is-done .tick { background: var(--led-green); border-color: var(--led-green); color: var(--ink); }
.item.is-needswork .tick { border-color: var(--led-amber); }
.item.is-needswork .tick svg { display: none; }
.item.is-needswork .tick::after {
  content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--led-amber);
}

.item__t {
  font-family: var(--f-display); font-weight: 600; font-size: 16.5px;
  letter-spacing: .005em; color: var(--text);
}
.item__s { color: var(--text-2); font-size: 14.5px; }
.item__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 3px; }

.teach {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--f-display); font-size: 12px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent);
  padding: 3px 0;
  border-bottom: 1px solid var(--line);
}
.teach:hover { border-bottom-color: var(--accent); }

.state {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--dim-2);
}
.item.is-done .state { color: var(--led-green); }
.item.is-needswork .state { color: var(--led-amber); }

.finale {
  margin-top: 30px; padding: 20px 22px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: var(--shadow);
}
.finale.is-locked { opacity: .6; }
.finale h3 { font-size: 19px; margin: 6px 0 10px; }
.finale p { color: var(--text-2); }
.finale ol { color: var(--text-2); margin: 12px 0 0; padding-left: 20px; }
.finale li { margin-bottom: 7px; }
.finale__lock {
  font-family: var(--f-mono); font-size: 11px; color: var(--dim);
  margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line);
}

/* ==========================================================================
   Lesson
   ========================================================================== */

.lesson {
  grid-column: 2;
  margin: 14px 0 4px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 5px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.lesson__in { padding: 18px 20px 20px; }
.lesson section + section { margin-top: 20px; }
.lesson h4 {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim); margin-bottom: 7px;
}
.lesson p { color: var(--text-2); font-size: 15px; }
.lesson ol, .lesson ul { margin: 0; padding-left: 21px; color: var(--text-2); font-size: 15px; }
.lesson li { margin-bottom: 7px; }
.lesson li:last-child { margin-bottom: 0; }

.lesson__why {
  font-size: 16px; color: var(--text);
  border-left: 2px solid var(--line); padding-left: 14px;
}

.hear {
  background: var(--panel-2); border: 1px solid var(--line-soft);
  border-radius: 5px; padding: 13px 15px;
}
.hear h4 { color: var(--led-cyan); }
.hear p { color: var(--text); }

.gotcha {
  background: var(--panel-2);
  border: 1px solid var(--led-red);
  border-radius: 5px; padding: 13px 15px;
}
.gotcha h4 { color: var(--led-red); }

.musical h4 { color: var(--led-magenta); }

.lesson__foot {
  display: flex; flex-wrap: wrap; gap: 9px;
  padding: 15px 20px;
  border-top: 1px solid var(--line-soft);
  background: var(--panel-2);
  border-radius: 0 0 5px 5px;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 15px;
  font-family: var(--f-display); font-weight: 600; font-size: 13.5px;
  letter-spacing: .05em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel-3); color: var(--text);
}
.btn:hover { border-color: var(--dim-2); }
.btn--go { background: var(--led-green); border-color: var(--led-green); color: var(--ink); }
.btn--go:hover { filter: brightness(1.08); border-color: var(--led-green); }
.btn--warn { background: transparent; border-color: var(--led-amber); color: var(--led-amber); }
.btn--warn:hover { border-color: var(--led-amber); filter: brightness(1.15); }
.btn--accent {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  box-shadow: var(--glow);
}
.btn--accent:hover { filter: brightness(1.07); border-color: var(--accent); }
.btn--ghost { background: transparent; color: var(--text-2); }

/* ==========================================================================
   Confirm modal
   ========================================================================== */

.modalscrim {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-items: center;
  padding: 18px;
  background: var(--scrim);
  animation: fade .16s ease;
}
@keyframes fade { from { opacity: 0 } }

.modal {
  width: min(520px, 100%);
  max-height: calc(100vh - 36px);
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  border-radius: 7px;
  box-shadow: var(--modalshadow);
  padding: 24px 24px 20px;
}
.modal__q {
  font-family: var(--f-display); font-weight: 600;
  font-size: 21px; line-height: 1.25; letter-spacing: -.004em;
  margin: 8px 0 12px;
}
.modal__s { color: var(--text-2); font-size: 15px; }
.modal__gesture { margin-top: 14px; }
.modal__acts { display: flex; flex-direction: column; gap: 9px; margin-top: 22px; }
.modal__acts .btn { width: 100%; padding: 12px 16px; }
.modal__recap {
  margin-top: 18px; padding: 15px 16px;
  background: var(--panel-2); border: 1px solid var(--line-soft);
  border-radius: 5px;
}
.modal__recap h4 {
  font-family: var(--f-display); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--led-amber); margin-bottom: 7px;
}
.modal__recap p { color: var(--text-2); font-size: 14.5px; }

/* ---------- toast ---------- */
.toasts {
  position: fixed; z-index: 95;
  left: 0; right: 0; margin-inline: auto;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
  width: min(440px, calc(100% - 36px));
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 10px 14px;
  background: var(--panel-3); color: var(--text);
  border: 1px solid var(--line); border-radius: 5px;
  box-shadow: var(--modalshadow);
  font-size: 14px;
  animation: rise .18s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px) } }
.toast__led { width: 8px; height: 8px; border-radius: 99px; background: var(--led-green); flex: none; }
.toast__led--amber { background: var(--led-amber); }
.toast__led--orange { background: var(--led-orange); }
.toast button {
  margin-left: auto; flex: none;
  font-family: var(--f-display); font-size: 12px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
}

/* ==========================================================================
   Widgets
   ========================================================================== */

.widget {
  margin-top: 16px;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--panel-2);
}
.widget__head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
}
.widget__title {
  font-family: var(--f-display); font-size: 11px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  margin-right: auto;
}
.widget__body { padding: 14px; }

.grid { display: flex; flex-direction: column; gap: 7px; }
.grid__row { display: grid; gap: 4px; }
.cell {
  position: relative;
  aspect-ratio: 1; min-width: 0; max-width: 100%;
  border-radius: 3px;
  background: var(--panel-3);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 9px; color: var(--dim-2);
  font-variant-numeric: tabular-nums;
}
.cell.on {
  background: var(--led-orange); border-color: var(--led-orange); color: var(--accent-ink);
}
.cell.manual { background: var(--led-white); border-color: var(--led-white); color: var(--ink); }
.cell.retrig { background: var(--led-red); border-color: var(--led-red); color: #fff; }
.cell.lock   { background: var(--led-cyan); border-color: var(--led-cyan); color: var(--ink); }
.cell.beat { border-color: var(--dim-2); }
.cell.play { outline: 2px solid var(--led-white); outline-offset: 1px; }

.controls { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.ctrl { display: grid; gap: 4px; }
.ctrl__lab {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--dim);
}
.ctrl__val { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.ctrl input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 22px; background: none; margin: 0;
}
.ctrl input[type="range"]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 99px; background: var(--panel-3);
}
.ctrl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 99px; margin-top: -5.5px;
  background: var(--accent); border: 0;
}
.ctrl input[type="range"]::-moz-range-track { height: 3px; border-radius: 99px; background: var(--panel-3); }
.ctrl input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 99px; background: var(--accent); }

.readout {
  font-family: var(--f-mono); font-size: 12px; color: var(--text-2);
  margin-top: 12px; padding-top: 11px; border-top: 1px dashed var(--line);
  line-height: 1.7;
}
.readout b { color: var(--text); font-weight: 500; }

.shapes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
.shape {
  border: 1px solid var(--line-soft); border-radius: 4px;
  background: var(--panel); padding: 8px 9px 6px;
}
.shape svg { display: block; width: 100%; height: 40px; max-width: 100%; }
.shape__lab {
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
  margin-top: 5px;
  font-family: var(--f-display); font-size: 11.5px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; color: var(--text-2);
}
.shape__vb { font-family: var(--f-mono); font-size: 10px; color: var(--dim-2); text-transform: none; letter-spacing: 0; }

.voicing { display: grid; gap: 4px; }
.voicing__row { display: grid; grid-template-columns: 86px 1fr; align-items: center; gap: 10px; }
.voicing__lab { font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); }
.voicing__seq { display: flex; gap: 3px; }
.voicing__n {
  flex: 1; min-width: 0; height: 16px; border-radius: 2px;
  background: var(--panel-3); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 8.5px; color: var(--dim-2);
}
.voicing__n.hi { background: var(--led-magenta); border-color: var(--led-magenta); color: #fff; }
.voicing__n.mid { background: var(--panel); border-color: var(--led-magenta); color: var(--text); }

.poly { display: grid; gap: 10px; }
.poly__lane { display: grid; grid-template-columns: 66px 1fr; align-items: center; gap: 10px; }
.poly__lab { font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); }
.poly__bar { display: flex; gap: 2px; }
.poly__u {
  flex: 1; min-width: 0; height: 14px; border-radius: 2px;
  background: var(--panel-3); border: 1px solid var(--line-soft);
}
.poly__u.a { background: var(--led-orange); border-color: var(--led-orange); }
.poly__u.b { background: var(--led-cyan); border-color: var(--led-cyan); }
.poly__u.edge { box-shadow: inset 2px 0 0 var(--led-white); }

/* ==========================================================================
   Cheat sheet / recipes / search
   ========================================================================== */

.panelhead { padding-top: 30px; padding-bottom: 18px; }
.panelhead h2 { font-size: clamp(24px, 4.6vw, 31px); letter-spacing: -.012em; margin: 6px 0 8px; }
.panelhead p { color: var(--dim); font-size: 14.5px; }

.filter {
  display: flex; align-items: center; gap: 10px;
  margin: 4px 0 22px; padding: 10px 13px;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--panel);
}
.filter input {
  flex: 1; min-width: 0;
  font: 400 15px/1.4 var(--f-body);
  background: none; border: 0; color: var(--text);
}
.filter input::placeholder { color: var(--dim-2); }
.filter input:focus { outline: none; }
.filter__n { font-family: var(--f-mono); font-size: 11px; color: var(--dim); white-space: nowrap; }

.qc { margin-bottom: 26px; }
.qc h3 {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.qc__note { color: var(--dim); font-size: 13.5px; margin-top: 9px; }
.qc table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.qc td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.qc td:first-child { color: var(--text-2); width: 46%; }
.qc td:last-child { padding-right: 0; }
.tablewrap { overflow-x: auto; }

/* group chips */
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 12px; }
.chipbtn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px;
  font-family: var(--f-display); font-size: 12.5px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-2);
  background: var(--panel); border: 1px solid var(--line); border-radius: 99px;
}
.chipbtn:hover { color: var(--text); border-color: var(--dim-2); }
.chipbtn.is-on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.chipbtn__n {
  font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: 0;
  opacity: .75; font-variant-numeric: tabular-nums;
}

/* collapsible recipe */
.recipes { border-top: 1px solid var(--line); }
.recipe { border-bottom: 1px solid var(--line-soft); }
.recipe.is-open { padding-bottom: 24px; }
.recipe__head {
  display: grid; grid-template-columns: 1fr auto; gap: 3px 14px;
  width: 100%; text-align: left;
  padding: 16px 2px 15px;
}
.recipe__head:hover .recipe__title { color: var(--accent); }
.recipe__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; grid-column: 1; }
.recipe__n {
  font-family: var(--f-mono); font-size: 10.5px; color: var(--accent);
  letter-spacing: .08em; text-transform: uppercase;
}
.recipe__bpm, .recipe__gear {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .03em;
  padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line);
  color: var(--text-2); background: var(--panel-2);
  font-variant-numeric: tabular-nums;
}
.recipe__bpm { color: var(--led-cyan); border-color: var(--led-cyan); }
.recipe__title {
  grid-column: 1;
  font-family: var(--f-display); font-weight: 600; font-size: 19px;
  letter-spacing: -.004em; color: var(--text); line-height: 1.25;
  text-wrap: balance;
}
.recipe__for { grid-column: 1; color: var(--dim); font-size: 14px; }
.recipe__caret {
  grid-column: 2; grid-row: 1 / span 3; align-self: center;
  width: 26px; height: 26px; border-radius: 4px;
  display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 15px; color: var(--dim);
  border: 1px solid var(--line);
}
.recipe.is-open .recipe__caret { color: var(--accent); border-color: var(--accent); }
.recipe__why { color: var(--text); font-size: 15px; }
.recipe__cols { display: grid; gap: 20px; padding: 4px 2px 0; }
.recipe h4 {
  font-family: var(--f-display); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--dim); margin-bottom: 7px;
}
.recipe ol, .recipe ul { margin: 0; padding-left: 20px; color: var(--text-2); font-size: 15px; }
.recipe li { margin-bottom: 7px; }
.recipe__tracks { list-style: none; padding: 0; }
.recipe__tracks li {
  display: grid; grid-template-columns: 74px 1fr; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--line-soft); margin: 0;
}
.recipe__tracks b {
  font-family: var(--f-mono); font-size: 11.5px; font-weight: 500;
  color: var(--led-orange); letter-spacing: .03em; padding-top: 2px;
}

.hit { display: block; width: 100%; text-align: left; border-bottom: 1px solid var(--line-soft); padding: 13px 2px; }
.hit:hover { background: var(--panel); }
.hit__u {
  font-family: var(--f-mono); font-size: 10.5px; color: var(--accent);
  letter-spacing: .06em; text-transform: uppercase;
}
.hit__t { font-family: var(--f-display); font-weight: 600; font-size: 16px; margin: 2px 0; }
.hit__s { color: var(--text-2); font-size: 14px; }
.empty { color: var(--dim); padding: 30px 0; font-size: 15px; }

.legend { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); margin-top: 16px; }
.legend__i { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text-2); }
.legend__sw { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid var(--line); }

.pagefoot {
  margin-top: 60px; padding-top: 20px;
  border-top: 1px solid var(--line-soft);
  color: var(--dim-2); font-size: 12.5px; line-height: 1.6;
}

[hidden] { display: none !important; }
.tool--accent { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.tool--accent:hover { color: var(--accent-ink); filter: brightness(1.07); border-color: var(--accent); }

/* Touch screens — the tablet beside the T1. Every control gets a
   finger-sized target; small visuals keep their look but grow their hit area. */
@media (pointer: coarse) {
  .tool, .chipbtn { min-height: 44px; padding-inline: 14px; }
  .unitbtn { padding-block: 12px 13px; }
  .item { grid-template-columns: 32px 1fr; }
  .tick { position: relative; width: 30px; height: 30px; margin-top: -3px; }
  .tick::before { content: ""; position: absolute; inset: -9px; }
  .tick svg { width: 17px; height: 17px; }
  .teach { min-height: 44px; }
  .btn { min-height: 44px; }
  .modal__acts .btn { min-height: 50px; }
  .recipe__head { min-height: 56px; }
  .hit { padding-block: 15px; }
  .ctrl input[type="range"] { height: 44px; }
  .ctrl input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -11.5px; }
  .ctrl input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; }
}

<body>
<div id="app"></div>

<script>
/* ==========================================================================
   widgets.js — visual explainers for things the T1 can only show you in LEDs
   Classic script; exposes window.T1W. No dependencies.
   ========================================================================== */
(function () {
  'use strict';

  var W = {};

  /* ---------------------------------------------------------------- helpers */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  W.esc = esc;

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  W.el = el;

  /* ------------------------------------------------- panel notation -> chips
     Written in lesson text as inline tokens so the prose stays readable:
       [PLAY]   a labelled button        -> .chip--btn
       [VB8]    a value button           -> .chip--vb
       (PULSES) an encoder               -> .chip--knob
       {1/16}   a value / setting        -> .chip--val
     [CTRL] renders dashed, matching the grey secondary-function silkscreen.
  ---------------------------------------------------------------------------*/

  var TOKEN = /\[([A-Z0-9 /&+-]{1,18})\]|\(([A-Z0-9 /&+-]{1,18})\)|\{([^{}]{1,24})\}/g;

  W.notate = function (text) {
    if (text == null) return '';
    var out = '';
    var last = 0;
    var s = String(text);
    s.replace(TOKEN, function (m, btn, knob, val, idx) {
      out += esc(s.slice(last, idx));
      if (btn != null) {
        var isVb = /^VB\d{1,2}$/.test(btn);
        var isCtrl = btn === 'CTRL';
        var cls = isVb ? 'chip chip--vb' : isCtrl ? 'chip chip--ctrl' : 'chip chip--btn';
        out += '<span class="' + cls + '">[' + esc(btn) + ']</span>';
      } else if (knob != null) {
        out += '<span class="chip chip--knob">(' + esc(knob) + ')</span>';
      } else {
        out += '<span class="chip chip--val">' + esc(val) + '</span>';
      }
      last = idx + m.length;
      return m;
    });
    out += esc(s.slice(last));
    return out;
  };

  /* --------------------------------------------------- euclidean distribution
     Bjorklund-style even spreading, the standard construction behind the
     Steps/Pulses pair. Rotation shifts the result without altering structure.
  ---------------------------------------------------------------------------*/

  W.euclid = function (steps, pulses, rotate) {
    steps = Math.max(1, steps | 0);
    pulses = Math.min(Math.max(0, pulses | 0), steps);
    var out = new Array(steps);
    var i;
    for (i = 0; i < steps; i++) out[i] = false;
    if (pulses === 0) return out;

    // Place pulse k at floor(k * steps / pulses): even spread, first step always on.
    for (var k = 0; k < pulses; k++) {
      out[Math.floor((k * steps) / pulses)] = true;
    }

    var r = ((rotate | 0) % steps + steps) % steps;
    if (!r) return out;
    var rot = new Array(steps);
    for (i = 0; i < steps; i++) rot[i] = out[(i + r) % steps];
    return rot;
  };

  /* --------------------------------------------------------------- step grid
     Renders up to 64 steps as the T1 does: rows of 16, one row per page.
     `marks` maps a step index to an extra class (manual / retrig / lock).
  ---------------------------------------------------------------------------*/

  W.grid = function (opts) {
    var steps = opts.steps || 16;
    var on = opts.on || [];
    var marks = opts.marks || {};
    var playhead = typeof opts.playhead === 'number' ? opts.playhead : -1;
    var showNums = opts.numbers !== false;

    var wrap = el('div', 'grid');
    var pages = Math.ceil(steps / 16);
    for (var p = 0; p < pages; p++) {
      var from = p * 16;
      var count = Math.min(16, steps - from);
      var row = el('div', 'grid__row');
      row.style.gridTemplateColumns = 'repeat(' + count + ', minmax(0, 1fr))';
      for (var i = 0; i < count; i++) {
        var idx = from + i;
        var cls = 'cell';
        if (on[idx]) cls += ' on';
        if (marks[idx]) cls += ' ' + marks[idx];
        if (idx % 4 === 0 && !on[idx] && !marks[idx]) cls += ' beat';
        if (idx === playhead) cls += ' play';
        var c = el('div', cls, showNums && count <= 16 ? String(idx + 1) : '');
        c.setAttribute('data-step', String(idx));
        row.appendChild(c);
      }
      wrap.appendChild(row);
    }
    return wrap;
  };

  /* ------------------------------------------------------ euclidean playground
     Steps / Pulses / Rotate sliders over a live grid with a walking playhead.
     This is the one thing the hardware cannot show you until you turn the knob.
  ---------------------------------------------------------------------------*/

  var DIVISIONS = [
    { lab: '1/4', beats: 1 },
    { lab: '1/8', beats: 0.5 },
    { lab: '1/8T', beats: 1 / 3 },
    { lab: '1/16', beats: 0.25 },
    { lab: '1/16T', beats: 1 / 6 },
    { lab: '1/32', beats: 0.125 }
  ];

  W.playground = function (init) {
    init = init || {};
    var st = {
      steps: init.steps || 16,
      pulses: init.pulses == null ? 5 : init.pulses,
      rotate: init.rotate || 0,
      div: init.div == null ? 3 : init.div,
      bpm: init.bpm || 120,
      running: init.running !== false,
      pos: 0
    };

    var root = el('div', 'widget');
    root.appendChild(el('div', 'widget__head',
      '<span class="widget__title">' + esc(init.title || 'Euclidean playground') + '</span>'));
    var body = el('div', 'widget__body');
    root.appendChild(body);

    var gridHost = el('div', '');
    body.appendChild(gridHost);

    var controls = el('div', 'controls');
    controls.style.marginTop = '14px';
    body.appendChild(controls);

    function slider(key, label, min, max, fmt) {
      var c = el('div', 'ctrl');
      var lab = el('div', 'ctrl__lab',
        '<span>' + esc(label) + '</span><span class="ctrl__val"></span>');
      var input = document.createElement('input');
      input.type = 'range';
      input.min = String(min);
      input.max = String(max);
      input.step = '1';
      input.value = String(st[key]);
      input.id = 'pg-' + key + '-' + Math.random().toString(36).slice(2, 7);
      input.setAttribute('aria-label', label);
      c.appendChild(lab);
      c.appendChild(input);
      controls.appendChild(c);
      var valEl = lab.querySelector('.ctrl__val');
      function sync() { valEl.textContent = fmt ? fmt(st[key]) : String(st[key]); }
      input.addEventListener('input', function () {
        st[key] = parseInt(input.value, 10);
        if (key === 'steps' && st.pulses > st.steps) st.pulses = st.steps;
        sync();
        draw();
      });
      sync();
      return { input: input, sync: sync };
    }

    var sSteps = slider('steps', 'Steps', 1, 32);
    var sPulses = slider('pulses', 'Pulses', 0, 32);
    slider('rotate', 'Rotate', 0, 31);
    slider('div', 'Division', 0, DIVISIONS.length - 1, function (v) { return DIVISIONS[v].lab; });
    slider('bpm', 'Tempo', 60, 200, function (v) { return v + ' BPM'; });

    var readout = el('div', 'readout');
    body.appendChild(readout);

    var runBtn = el('button', 'tool', st.running ? 'Pause' : 'Run');
    runBtn.type = 'button';
    root.querySelector('.widget__head').appendChild(runBtn);
    runBtn.addEventListener('click', function () {
      st.running = !st.running;
      runBtn.textContent = st.running ? 'Pause' : 'Run';
      if (st.running) tick(true);
    });

    function draw() {
      sPulses.input.max = String(st.steps);
      if (st.pulses > st.steps) { st.pulses = st.steps; sPulses.input.value = String(st.pulses); sPulses.sync(); }
      var pat = W.euclid(st.steps, st.pulses, st.rotate);
      gridHost.innerHTML = '';
      gridHost.appendChild(W.grid({
        steps: st.steps,
        on: pat,
        playhead: st.running ? st.pos % st.steps : -1
      }));
      var d = DIVISIONS[st.div];
      var bars = (st.steps * d.beats) / 4;
      readout.innerHTML =
        '<b>' + st.pulses + '</b> pulses over <b>' + st.steps + '</b> steps at <b>' + d.lab + '</b>' +
        ' &rarr; the loop takes <b>' + (Math.round(bars * 100) / 100) + '</b> bar' +
        (Math.abs(bars - 1) < 0.001 ? '' : 's') + ' to come back around.' +
        (bars > 1.001
          ? '<br>On the T1 that needs a Length of at least <b>' + Math.ceil(bars - 0.001) +
            '</b> bars &mdash; at the default 1 bar the track restarts every downbeat and the rest never plays.'
          : '') +
        '<br>Pattern: <b>' + pat.map(function (x) { return x ? 'x' : '.'; }).join('') + '</b>';
    }

    var timer = null;
    function tick(restart) {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!st.running) return;
      if (restart) st.pos = 0;
      var ms = (60000 / st.bpm) * DIVISIONS[st.div].beats;
      timer = setTimeout(function () {
        st.pos = (st.pos + 1) % st.steps;
        draw();
        tick(false);
      }, Math.max(45, ms));
    }

    draw();
    tick(true);

    root.destroy = function () { if (timer) clearTimeout(timer); };
    return root;
  };

  /* ------------------------------------------------------------ shape strips
     The fixed Groove and Phrase tables are printed shapes on the panel.
     Drawn here at the same value-button positions the manual assigns them,
     traced from the shape diagrams in the official Accent & Groove and
     Range & Phrase reference pages.
  ---------------------------------------------------------------------------*/

  function polyline(points, w, h) {
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<line x1="0" y1="' + (h / 2) + '" x2="' + w + '" y2="' + (h / 2) +
      '" stroke="currentColor" stroke-width="1" opacity=".18" />' +
      '<polyline points="' + points + '" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />' +
      '</svg>';
  }

  function bars(vals, w, h) {
    var n = vals.length;
    var bw = w / n;
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">';
    s += '<line x1="0" y1="' + (h - 1) + '" x2="' + w + '" y2="' + (h - 1) +
      '" stroke="currentColor" stroke-width="1" opacity=".18" />';
    for (var i = 0; i < n; i++) {
      var hh = Math.max(1.5, vals[i] * (h - 3));   // 0..1, as the manual draws it
      s += '<rect x="' + (i * bw + bw * 0.18).toFixed(2) + '" y="' + (h - 1 - hh).toFixed(2) +
        '" width="' + (bw * 0.64).toFixed(2) + '" height="' + hh.toFixed(2) +
        '" fill="currentColor" rx="0.8" />';
    }
    return s + '</svg>';
  }

  // The manual draws every LFO shape as four cycles across its strip.
  function wave(kind, n, cycles) {
    var v = [];
    for (var i = 0; i < n; i++) {
      var t = ((i / n) * (cycles || 1)) % 1;
      if (kind === 'saw') v.push(-1 + 2 * t);
      else if (kind === 'tri') v.push(t < 0.5 ? -1 + 4 * t : 3 - 4 * t);
      else if (kind === 'sine') v.push(Math.sin(2 * Math.PI * t));
      else v.push(t < 0.5 ? 1 : -1);
    }
    return v;
  }

  function unipolar(vals) { return vals.map(function (x) { return (x + 1) / 2; }); }

  // Groove templates: accent level per step, 0..1, measured from the manual's diagrams.
  var GROOVES = [
    { name: 'Agogo',    vb: 'VB1',  v: [.63, .17, .58, .17, .88, 1, .17, .58, .17, .58, .17, .63, .17, 1, .88, .17] },
    { name: 'Timbales', vb: 'VB2',  v: [.31, .17, 1, .41, .31, .26, .55, .31, .82, .41, .26, .31, .67, .41, .17, .26] },
    { name: 'Congas',   vb: 'VB3',  v: [.25, .35, .64, .21, .35, .35, 1, .29, .21, .25, .73, .44, .85, .35, 1, .16] },
    { name: 'Bongo',    vb: 'VB4',  v: [.27, .62, .32, .39, .87, .21, .27, .62, .21, .39, .5, 1, .39, .46, 1, .21] },
    { name: 'Saw',      vb: 'VB9',  v: unipolar(wave('saw', 32, 4)) },
    { name: 'Triangle', vb: 'VB10', v: unipolar(wave('tri', 32, 4)) },
    { name: 'Sine',     vb: 'VB11', v: unipolar(wave('sine', 32, 4)) },
    { name: 'Pulse',    vb: 'VB12', v: unipolar(wave('pulse', 32, 4)) }
  ];

  W.grooveShapes = function () {
    var wrap = el('div', 'widget');
    wrap.appendChild(el('div', 'widget__head',
      '<span class="widget__title">Groove templates &mdash; the accent contour each one applies</span>'));
    var body = el('div', 'widget__body');
    var g = el('div', 'shapes');
    GROOVES.forEach(function (s) {
      var card = el('div', 'shape', bars(s.v, 120, 40) +
        '<div class="shape__lab"><span>' + esc(s.name) + '</span>' +
        '<span class="shape__vb">[' + s.vb + ']</span></div>');
      card.style.color = 'var(--led-orange)';
      g.appendChild(card);
    });
    body.appendChild(g);
    body.appendChild(el('div', 'readout',
      'Shapes follow the diagrams in the official guide: taller bars get more velocity. Accent is bipolar around the ' +
      'track base Velocity, so the high points push notes <b>above</b> it and the low points pull them <b>under</b>. ' +
      'Accent sets how far; Groove picks which contour. Groove length defaults to <b>4 bars</b> &mdash; ' +
      '[VB8] shortens it, [VB16] lengthens it.'));
    wrap.appendChild(body);
    return wrap;
  };

  // Phrase shapes: melodic contours driven by Range. Cadences are four held
  // steps relative to the starting note (0), as the manual draws them.
  var PHRASES = [
    { name: 'Cadence 1', vb: 'VB1',  steps: [0, .5, 1, 1] },
    { name: 'Cadence 2', vb: 'VB2',  steps: [0, 0, .4, .85] },
    { name: 'Cadence 3', vb: 'VB3',  steps: [0, .45, -.9, -.25] },
    { name: 'Cadence 4', vb: 'VB4',  steps: [0, .1, -.9, -.6] },
    { name: 'Saw',       vb: 'VB9',  v: null, kind: 'saw' },
    { name: 'Triangle',  vb: 'VB10', v: null, kind: 'tri' },
    { name: 'Sine',      vb: 'VB11', v: null, kind: 'sine' },
    { name: 'Pulse',     vb: 'VB12', v: null, kind: 'pulse' },
    { name: 'CV input',  vb: 'VB16', v: null, kind: 'cv' }
  ];

  W.phraseShapes = function () {
    var wrap = el('div', 'widget');
    wrap.appendChild(el('div', 'widget__head',
      '<span class="widget__title">Phrase shapes &mdash; the melodic contour Range walks through</span>'));
    var body = el('div', 'widget__body');
    var g = el('div', 'shapes');

    PHRASES.forEach(function (s) {
      var pts, svg;
      if (s.kind === 'cv') {
        svg = '<svg viewBox="0 0 120 40" preserveAspectRatio="none" aria-hidden="true">' +
          '<line x1="0" y1="20" x2="120" y2="20" stroke="currentColor" stroke-width="1" opacity=".18"/>' +
          '<polyline points="0,30 18,12 30,26 48,8 62,22 78,14 96,30 120,18" fill="none" ' +
          'stroke="currentColor" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/></svg>';
      } else if (s.steps) {
        var seg = 120 / s.steps.length;
        pts = s.steps.map(function (v, i) {
          var y = (20 - v * 16).toFixed(1);
          return (i * seg).toFixed(1) + ',' + y + ' ' + ((i + 1) * seg).toFixed(1) + ',' + y;
        }).join(' ');
        svg = polyline(pts, 120, 40);
      } else {
        var vals = wave(s.kind, 97, 4);
        pts = vals.map(function (v, i) {
          var x = (i / (vals.length - 1)) * 120;
          var y = 20 - v * 16;
          return x.toFixed(1) + ',' + y.toFixed(1);
        }).join(' ');
        svg = polyline(pts, 120, 40);
      }
      var card = el('div', 'shape', svg +
        '<div class="shape__lab"><span>' + esc(s.name) + '</span>' +
        '<span class="shape__vb">[' + s.vb + ']</span></div>');
      card.style.color = 'var(--led-magenta)';
      g.appendChild(card);
    });

    body.appendChild(g);
    body.appendChild(el('div', 'readout',
      'The shape is the contour; <b>Range</b> is how far up and down that contour reaches inside the ' +
      'current Scale; the faint line is the starting note. Cadence 1 and 2 step upward; Cadence 3 and 4 step up ' +
      'or hold, then drop below it. Saw / Triangle / Sine / Pulse behave like tempo-synced LFOs. Shapes follow the ' +
      'diagrams in the official guide. Phrase length defaults to <b>4 bars</b>. ' +
      '[VB16] hands the contour over to the CV input instead.'));
    wrap.appendChild(body);
    return wrap;
  };

  /* ------------------------------------------------------- voicing motion map
     All five styles use the same movement (lowest note up an octave, or highest
     note down an octave). What differs is the order it is played in.
  ---------------------------------------------------------------------------*/

  var VOICINGS = [
    { name: 'Fixed',         poly: 'VB1/VB9',  seq: [0, 0, 0, 0, 0, 0, 0, 0] },
    { name: 'Ramp',          poly: 'VB2/VB10', seq: [0, 1, 2, 3, 0, 1, 2, 3] },
    { name: 'Climb',         poly: 'VB3/VB11', seq: [0, 1, 2, 1, 2, 3, 2, 3] },
    { name: 'Up/Down',       poly: 'VB4/VB12', seq: [0, 1, 2, 3, 2, 1, 0, 1] },
    { name: 'Climb Up/Down', poly: 'VB5/VB13', seq: [0, 1, 2, 1, 2, 3, 2, 1] }
  ];

  W.voicingMap = function () {
    var wrap = el('div', 'widget');
    wrap.appendChild(el('div', 'widget__head',
      '<span class="widget__title">Voicing styles &mdash; how the same shift is played over time</span>'));
    var body = el('div', 'widget__body');
    var v = el('div', 'voicing');

    VOICINGS.forEach(function (s) {
      var row = el('div', 'voicing__row');
      row.appendChild(el('div', 'voicing__lab', esc(s.name)));
      var seq = el('div', 'voicing__seq');
      s.seq.forEach(function (n) {
        var cls = 'voicing__n' + (n === 3 ? ' hi' : n > 0 ? ' mid' : '');
        seq.appendChild(el('div', cls, String(n)));
      });
      row.appendChild(seq);
      v.appendChild(row);
    });

    body.appendChild(v);
    body.appendChild(el('div', 'readout',
      '0 is the chord as you selected it; 3 is the fully shifted voicing. ' +
      'Every style is available twice: a <b>polyphonic</b> variant plays the notes together (chords) ' +
      'and a <b>monophonic</b> variant plays them one at a time (arpeggios). ' +
      '[VB8] sets upward motion, [VB16] downward.'));
    wrap.appendChild(body);
    return wrap;
  };

  /* --------------------------------------------------------- polymeter drift
     Steps sets the grid size; Length sets how much of it plays before looping.
     When they disagree, the pattern walks against the bar.
  ---------------------------------------------------------------------------*/

  W.polymeter = function (opts) {
    opts = opts || {};
    var steps = opts.steps || 12;
    var barSteps = opts.barSteps || 16;   // one bar at the current Division
    var bars = opts.bars || 4;
    var total = barSteps * bars;

    var wrap = el('div', 'widget');
    wrap.appendChild(el('div', 'widget__head',
      '<span class="widget__title">' + steps + ' steps against the bar, ' +
      'Length ' + (opts.lengthLabel || 'infinite') + '</span>'));
    var body = el('div', 'widget__body');
    var p = el('div', 'poly');

    function lane(label, cls, period) {
      var l = el('div', 'poly__lane');
      l.appendChild(el('div', 'poly__lab', esc(label)));
      var bar = el('div', 'poly__bar');
      for (var i = 0; i < total; i++) {
        var u = el('div', 'poly__u' + (i % period === 0 ? ' ' + cls + ' edge' : ''));
        bar.appendChild(u);
      }
      l.appendChild(bar);
      p.appendChild(l);
    }

    lane('Bar', 'b', barSteps);
    lane(steps + ' steps', 'a', steps);

    body.appendChild(p);
    body.appendChild(el('div', 'readout',
      'With Length on infinite the track loops every <b>' + steps + '</b> steps while the bar comes round every <b>' +
      barSteps + '</b>, so they only agree again after <b>' +
      (lcm(steps, barSteps) / barSteps) + '</b> bars &mdash; that drift is the whole point. ' +
      'At the default <b>1-bar</b> Length the track is dragged back to step 1 on every downbeat instead, ' +
      'and every bar sounds the same.'));
    wrap.appendChild(body);
    return wrap;
  };

  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
  function lcm(a, b) { return (a * b) / gcd(a, b); }

  /* ------------------------------------------------------------- track colours
     The device has no screen, so colour IS the readout. Worth memorising.
  ---------------------------------------------------------------------------*/

  W.colourLegend = function (rows, title) {
    var wrap = el('div', 'widget');
    wrap.appendChild(el('div', 'widget__head',
      '<span class="widget__title">' + esc(title || 'What the lights mean') + '</span>'));
    var body = el('div', 'widget__body');
    var g = el('div', 'legend');
    rows.forEach(function (r) {
      var i = el('div', 'legend__i');
      var sw = el('span', 'legend__sw');
      sw.style.background = r.c;
      i.appendChild(sw);
      i.appendChild(el('span', '', W.notate(r.t)));
      g.appendChild(i);
    });
    body.appendChild(g);
    wrap.appendChild(body);
    return wrap;
  };

  /* -------------------------------------------------------------- dispatcher */

  W.build = function (spec) {
    if (!spec || !spec.type) return null;
    switch (spec.type) {
      case 'euclid':    return W.playground(spec);
      case 'grooves':   return W.grooveShapes();
      case 'phrases':   return W.phraseShapes();
      case 'voicings':  return W.voicingMap();
      case 'polymeter': return W.polymeter(spec);
      case 'colours':   return W.colourLegend(spec.rows, spec.title);
      case 'grid':      {
        var w = el('div', 'widget');
        w.appendChild(el('div', 'widget__head',
          '<span class="widget__title">' + esc(spec.title || 'Step grid') + '</span>'));
        var b = el('div', 'widget__body');
        b.appendChild(W.grid({
          steps: spec.steps || 16,
          on: spec.on || W.euclid(spec.steps || 16, spec.pulses || 0, spec.rotate || 0),
          marks: spec.marks || {}
        }));
        if (spec.note) b.appendChild(el('div', 'readout', W.notate(spec.note)));
        w.appendChild(b);
        return w;
      }
      default: return null;
    }
  };

  window.T1W = W;
})();
</script>
