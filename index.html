<script>
/* ==========================================================================
   app.js — T1 Practice Coach
   State, routing, the confirm gate, lessons, progress. Classic script.
   ========================================================================== */
(function () {
  'use strict';

  var W = window.T1W;
  var DATA = window.T1_DATA || { units: [], quickCommands: [], recipes: [] };
  var notate = W.notate;
  var esc = W.esc;
  var el = W.el;

  var STORE_KEY = 't1-practice-coach.v1';

  /* ------------------------------------------------------------------ state */

  var state = {
    view: 'unit',          // unit | cheatsheet | recipes | search
    unitId: DATA.units.length ? DATA.units[0].id : null,
    openLesson: null,      // item id whose lesson is expanded
    query: '',
    recipeGroup: 'all',
    recipeQuery: '',
    openRecipes: {},
    awake: false,          // keep the screen on while the page is visible
    progress: {}           // itemId -> { s: 'done'|'work', at: iso }
  };

  var liveWidgets = [];

  /* --------------------------------------------------------------- storage
     file:// origins, private windows and blocked site data can all throw or
     come back empty. Every path has to survive that without breaking render. */

  function load() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object' && parsed.progress) {
        state.progress = parsed.progress;
        state.awake = !!parsed.awake;
        if (parsed.theme) applyTheme(parsed.theme, true);
      }
    } catch (e) { /* no stored progress; render from empty */ }
  }

  function save() {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        v: 1,
        progress: state.progress,
        theme: document.documentElement.getAttribute('data-theme') || '',
        awake: state.awake,
        saved: new Date().toISOString()
      }));
      storageWorks = true;
    } catch (e) { storageWorks = false; }
  }

  /* Some browsers refuse storage on a file:// origin, and private windows can
     refuse it anywhere. Worth saying so once rather than silently losing ticks. */
  var storageWorks = true;

  function probeStorage() {
    try {
      var k = STORE_KEY + '.probe';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      storageWorks = true;
    } catch (e) { storageWorks = false; }
  }

  /* ----------------------------------------------------------------- lookup */

  var itemIndex = {};
  var unitOfItem = {};
  DATA.units.forEach(function (u) {
    (u.items || []).forEach(function (it) {
      itemIndex[it.id] = it;
      unitOfItem[it.id] = u;
    });
  });

  function unitById(id) {
    for (var i = 0; i < DATA.units.length; i++) if (DATA.units[i].id === id) return DATA.units[i];
    return DATA.units[0] || null;
  }

  function stateOf(id) {
    var p = state.progress[id];
    return p ? p.s : null;
  }

  function counts(unit) {
    var done = 0, work = 0;
    (unit.items || []).forEach(function (it) {
      var s = stateOf(it.id);
      if (s === 'done') done++; else if (s === 'work') work++;
    });
    return { done: done, work: work, total: (unit.items || []).length };
  }

  function overall() {
    var done = 0, work = 0, total = 0;
    DATA.units.forEach(function (u) {
      var c = counts(u);
      done += c.done; work += c.work; total += c.total;
    });
    return { done: done, work: work, total: total };
  }

  /* ------------------------------------------------------------------ meter */

  function meter(c) {
    var pctDone = c.total ? (c.done / c.total) * 100 : 0;
    var pctWork = c.total ? (c.work / c.total) * 100 : 0;
    var m = el('div', 'meter');
    m.setAttribute('role', 'img');
    m.setAttribute('aria-label', c.done + ' of ' + c.total + ' understood, ' + c.work + ' flagged');
    var d = el('div', 'meter__done'); d.style.width = pctDone + '%';
    var w = el('div', 'meter__work'); w.style.width = pctWork + '%';
    m.appendChild(d); m.appendChild(w);
    return m;
  }

  /* ------------------------------------------------------------------ toasts */

  var toastHost;

  function toast(msg, tone, action) {
    if (!toastHost) return;
    var t = el('div', 'toast');
    t.appendChild(el('span', 'toast__led' + (tone ? ' toast__led--' + tone : '')));
    t.appendChild(el('span', '', notate(msg)));
    if (action) {
      var b = el('button', '', action.label);
      b.type = 'button';
      b.addEventListener('click', function () { action.fn(); t.remove(); });
      t.appendChild(b);
    }
    toastHost.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .3s ease';
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 320);
    }, action ? 6000 : 3200);
  }

  /* =========================================================================
     The confirm gate — ticking an item asks before it counts
     ========================================================================= */

  var modalHost;
  var lastFocus = null;

  function closeModal() {
    if (!modalHost) return;
    modalHost.innerHTML = '';
    modalHost.hidden = true;
    document.removeEventListener('keydown', modalKeys);
    if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  }

  function modalKeys(e) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
  }

  function openConfirm(item) {
    var unit = unitOfItem[item.id];
    lastFocus = document.activeElement;

    var scrim = el('div', 'modalscrim');
    var box = el('div', 'modal');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-labelledby', 'confirm-q');

    box.appendChild(el('div', 'eyebrow', esc(unit.short || unit.title)));
    var q = el('h3', 'modal__q', 'Do you understand <em>' + esc(item.title) + '</em>?');
    q.id = 'confirm-q';
    box.appendChild(q);
    box.appendChild(el('p', 'modal__s', notate(item.summary)));

    if (item.gesture) {
      box.appendChild(el('div', 'modal__gesture gesture', notate(item.gesture)));
    }

    var acts = el('div', 'modal__acts');

    var yes = el('button', 'btn btn--go', 'Yes, I understand');
    yes.type = 'button';
    yes.addEventListener('click', function () {
      setItem(item.id, 'done');
      closeModal();
      var c = counts(unit);
      toast(esc(unit.short || unit.title) + ': ' + c.done + ' of ' + c.total + ' understood', 'green');
    });

    var no = el('button', 'btn btn--warn', 'No, not yet');
    no.type = 'button';
    no.addEventListener('click', function () { setItem(item.id, 'work'); showRecap(); });

    var teach = el('button', 'btn btn--accent', 'Teach me an example');
    teach.type = 'button';
    teach.addEventListener('click', function () {
      closeModal();
      state.openLesson = item.id;
      if (state.view !== 'unit' || state.unitId !== unit.id) {
        state.view = 'unit';
        state.unitId = unit.id;
      }
      render();
      scrollToItem(item.id);
    });

    acts.appendChild(yes);
    acts.appendChild(no);
    acts.appendChild(teach);
    box.appendChild(acts);

    function showRecap() {
      acts.innerHTML = '';
      var recap = el('div', 'modal__recap',
        '<h4>Flagged for another pass</h4><p>' + notate(item.recap || item.summary) + '</p>');
      box.insertBefore(recap, null);
      var t2 = el('button', 'btn btn--accent', 'Teach me an example');
      t2.type = 'button';
      t2.addEventListener('click', function () { teach.click(); });
      var cl = el('button', 'btn btn--ghost', 'Close');
      cl.type = 'button';
      cl.addEventListener('click', closeModal);
      acts.appendChild(t2);
      acts.appendChild(cl);
      box.appendChild(acts);
      t2.focus();
      toast('Flagged as needs work — nothing checked off', 'amber');
    }

    scrim.appendChild(box);
    scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) closeModal(); });

    modalHost.innerHTML = '';
    modalHost.hidden = false;
    modalHost.appendChild(scrim);
    document.addEventListener('keydown', modalKeys);
    yes.focus();
  }

  function setItem(id, s) {
    if (s === null) delete state.progress[id];
    else state.progress[id] = { s: s, at: new Date().toISOString() };
    save();
    render();
  }

  function scrollToItem(id) {
    setTimeout(function () {
      var node = document.getElementById('item-' + id);
      if (node) node.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 30);
  }

  /* =========================================================================
     Rendering
     ========================================================================= */

  var rail, mainHost;

  function renderRail() {
    rail.innerHTML = '';

    var o = overall();
    var head = el('div', 'rail__head');
    var pct = o.total ? Math.round((o.done / o.total) * 100) : 0;
    var ov = el('div', 'overall',
      '<span class="overall__pct">' + pct + '%</span>' +
      '<span class="overall__of">' + o.done + ' of ' + o.total + ' understood' +
      (o.work ? ' &middot; ' + o.work + ' flagged' : '') + '</span>');
    head.appendChild(ov);
    head.appendChild(meter(o));
    rail.appendChild(head);

    var list = el('ul', 'rail__list');
    DATA.units.forEach(function (u, i) {
      var c = counts(u);
      var li = el('li');
      var b = el('button', 'unitbtn' + (c.total && c.done === c.total ? ' is-complete' : ''));
      b.type = 'button';
      b.setAttribute('aria-current', state.view === 'unit' && state.unitId === u.id ? 'true' : 'false');
      b.innerHTML =
        '<span class="unitbtn__n">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</span>' +
        '<span class="unitbtn__t">' + esc(u.title) + '</span>';
      var m = el('span', 'unitbtn__m');
      m.appendChild(meter(c));
      m.appendChild(el('span', 'unitbtn__c', c.done + '/' + c.total));
      b.appendChild(m);
      b.addEventListener('click', function () {
        state.view = 'unit';
        state.unitId = u.id;
        state.openLesson = null;
        closeRail();
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
      });
      li.appendChild(b);
      list.appendChild(li);
    });
    rail.appendChild(list);

    var foot = el('div', 'rail__foot');
    installBtn = el('button', 'tool tool--accent', 'Install app');
    installBtn.type = 'button';
    installBtn.hidden = !installEvent;
    installBtn.addEventListener('click', installApp);
    foot.appendChild(installBtn);
    if (wakeSupported) {
      awakeBtn = el('button', 'tool', '');
      awakeBtn.type = 'button';
      awakeBtn.addEventListener('click', function () { setAwake(!(state.awake && wakeLock)); });
      paintAwake();
      foot.appendChild(awakeBtn);
    }
    var exp = el('button', 'tool', 'Export progress');
    exp.type = 'button';
    exp.addEventListener('click', exportProgress);
    var imp = el('button', 'tool', 'Import progress');
    imp.type = 'button';
    imp.addEventListener('click', importProgress);
    foot.appendChild(exp);
    foot.appendChild(imp);
    if (!storageWorks) {
      foot.appendChild(el('p', 'warnnote',
        'This browser will not let the page store anything, so ticks are kept for this ' +
        'session only. Serve the folder over http, or use a different browser, to keep progress.'));
    }
    foot.appendChild(el('p', 'provenance',
      'Unofficial personal study guide. All device behaviour is drawn from the official ' +
      '<a href="https://docs.torsoelectronics.com/t1/introduction/" target="_blank" rel="noopener">T1 documentation</a>. ' +
      'Not affiliated with Torso Electronics.'));
    rail.appendChild(foot);
  }

  /* ---------------------------------------------------------------- lessons */

  function lessonNode(item) {
    var L = item.lesson || {};
    var box = el('div', 'lesson');
    var inner = el('div', 'lesson__in');

    function section(cls, heading, html) {
      var s = el('section', cls);
      if (heading) s.appendChild(el('h4', '', heading));
      s.insertAdjacentHTML('beforeend', html);
      inner.appendChild(s);
      return s;
    }

    if (L.why) section('', 'Why it matters', '<p class="lesson__why">' + notate(L.why) + '</p>');

    if (L.gesture) section('', 'The gesture', '<p class="gesture">' + notate(L.gesture) + '</p>');

    if (L.doThis && L.doThis.length) {
      section('', 'Do this now, on the hardware',
        '<ol>' + L.doThis.map(function (s) { return '<li>' + notate(s) + '</li>'; }).join('') + '</ol>');
    }

    if (L.widget) {
      var w = W.build(L.widget);
      if (w) {
        inner.appendChild(w);
        if (w.destroy) liveWidgets.push(w);
      }
    }

    if (L.hear) section('hear', 'What you should hear', '<p>' + notate(L.hear) + '</p>');

    if (L.changeOne && L.changeOne.length) {
      section('', 'Now change one thing',
        '<ul>' + L.changeOne.map(function (s) { return '<li>' + notate(s) + '</li>'; }).join('') + '</ul>');
    }

    if (L.musical) section('musical', 'Where this lives in real music', '<p>' + notate(L.musical) + '</p>');

    if (L.gotcha) section('gotcha', 'The trap', '<p>' + notate(L.gotcha) + '</p>');

    box.appendChild(inner);

    var foot = el('div', 'lesson__foot');
    var got = el('button', 'btn btn--go', "I've got it");
    got.type = 'button';
    got.addEventListener('click', function () {
      state.openLesson = null;
      setItem(item.id, 'done');
      var u = unitOfItem[item.id];
      var c = counts(u);
      toast(esc(u.short || u.title) + ': ' + c.done + ' of ' + c.total + ' understood', 'green');
    });
    var fuzzy = el('button', 'btn btn--warn', 'Still fuzzy');
    fuzzy.type = 'button';
    fuzzy.addEventListener('click', function () {
      state.openLesson = null;
      setItem(item.id, 'work');
      toast('Left flagged — come back to it', 'amber');
    });
    var back = el('button', 'btn btn--ghost', 'Close lesson');
    back.type = 'button';
    back.addEventListener('click', function () {
      state.openLesson = null;
      render();
      scrollToItem(item.id);
    });
    foot.appendChild(got);
    foot.appendChild(fuzzy);
    foot.appendChild(back);
    box.appendChild(foot);

    return box;
  }

  /* ------------------------------------------------------------- unit view */

  var TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8" fill="none" ' +
    'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderUnit(host) {
    var u = unitById(state.unitId);
    if (!u) { host.appendChild(el('p', 'empty', 'No units loaded.')); return; }
    var idx = DATA.units.indexOf(u) + 1;
    var c = counts(u);

    var head = el('div', 'unithead');
    head.appendChild(el('div', 'unithead__n',
      'Unit ' + (idx < 10 ? '0' : '') + idx + ' of ' + DATA.units.length));
    head.appendChild(el('h2', '', esc(u.title)));
    if (u.tagline) head.appendChild(el('p', 'unithead__tag', notate(u.tagline)));
    if (u.intro) head.appendChild(el('p', 'unithead__intro', notate(u.intro)));

    var um = el('div', 'unitmeter');
    um.appendChild(meter(c));
    um.appendChild(el('span', 'unitmeter__c',
      c.done + '/' + c.total + (c.work ? ' · ' + c.work + ' flagged' : '')));
    head.appendChild(um);
    host.appendChild(head);

    if (u.widget) {
      var uw = W.build(u.widget);
      if (uw) { host.appendChild(uw); if (uw.destroy) liveWidgets.push(uw); }
    }

    var list = el('ul', 'checklist');
    (u.items || []).forEach(function (item) {
      var s = stateOf(item.id);
      var li = el('li', 'item' + (s === 'done' ? ' is-done' : s === 'work' ? ' is-needswork' : ''));
      li.id = 'item-' + item.id;

      var tick = el('button', 'tick', TICK);
      tick.type = 'button';
      tick.setAttribute('aria-pressed', s === 'done' ? 'true' : 'false');
      tick.setAttribute('aria-label',
        (s === 'done' ? 'Uncheck' : 'Check off') + ': ' + item.title);
      tick.addEventListener('click', function () {
        if (stateOf(item.id) === 'done') {
          var prev = state.progress[item.id];
          setItem(item.id, null);
          toast('Unchecked ' + esc(item.title), 'orange', {
            label: 'Undo',
            fn: function () { state.progress[item.id] = prev; save(); render(); }
          });
        } else {
          openConfirm(item);
        }
      });
      li.appendChild(tick);

      li.appendChild(el('div', 'item__t', notate(item.title)));
      li.appendChild(el('div', 'item__s', notate(item.summary)));

      var foot = el('div', 'item__foot');
      var teach = el('button', 'teach',
        state.openLesson === item.id ? 'Hide lesson' : 'Teach me an example');
      teach.type = 'button';
      teach.addEventListener('click', function () {
        state.openLesson = state.openLesson === item.id ? null : item.id;
        render();
        scrollToItem(item.id);
      });
      foot.appendChild(teach);
      if (s) {
        foot.appendChild(el('span', 'state', s === 'done' ? 'Understood' : 'Needs work'));
      }
      li.appendChild(foot);

      if (state.openLesson === item.id) li.appendChild(lessonNode(item));

      list.appendChild(li);
    });
    host.appendChild(list);

    if (u.finale) {
      var locked = c.done < c.total;
      var f = el('div', 'finale' + (locked ? ' is-locked' : ''));
      f.appendChild(el('div', 'eyebrow', 'Play it'));
      f.appendChild(el('h3', '', esc(u.finale.title)));
      f.appendChild(el('p', '', notate(u.finale.body)));
      if (u.finale.steps) {
        f.insertAdjacentHTML('beforeend',
          '<ol>' + u.finale.steps.map(function (s) { return '<li>' + notate(s) + '</li>'; }).join('') + '</ol>');
      }
      if (locked) {
        f.appendChild(el('p', 'finale__lock',
          (c.total - c.done) + ' item' + (c.total - c.done === 1 ? '' : 's') +
          ' left in this unit before the exercise uses everything in it.'));
      }
      host.appendChild(f);
    }

    var nav = el('div', '');
    nav.style.cssText = 'display:flex;gap:9px;flex-wrap:wrap;margin-top:28px';
    if (idx > 1) {
      var prev = el('button', 'btn btn--ghost', '← ' + DATA.units[idx - 2].title);
      prev.type = 'button';
      prev.addEventListener('click', function () { goUnit(DATA.units[idx - 2].id); });
      nav.appendChild(prev);
    }
    if (idx < DATA.units.length) {
      var next = el('button', 'btn', DATA.units[idx].title + ' →');
      next.type = 'button';
      next.addEventListener('click', function () { goUnit(DATA.units[idx].id); });
      nav.appendChild(next);
    }
    host.appendChild(nav);
  }

  function goUnit(id) {
    state.unitId = id;
    state.view = 'unit';
    state.openLesson = null;
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ---------------------------------------------------------- cheat sheet */

  function renderCheatsheet(host) {
    var head = el('div', 'panelhead');
    head.appendChild(el('div', 'eyebrow', 'Reference'));
    head.appendChild(el('h2', '', 'Quick commands'));
    head.appendChild(el('p', '',
      'Every gesture on one page, filtered as you type. This is the page to leave open while you play.'));
    host.appendChild(head);

    var filter = el('div', 'filter');
    var input = document.createElement('input');
    input.type = 'search';
    input.id = 'cheat-filter';
    input.placeholder = 'Filter — try "mute", "cycle", "copy", "CTRL"';
    input.setAttribute('aria-label', 'Filter quick commands');
    var n = el('span', 'filter__n');
    filter.appendChild(input);
    filter.appendChild(n);
    host.appendChild(filter);

    var results = el('div', '');
    host.appendChild(results);

    function draw() {
      var q = input.value.trim().toLowerCase();
      results.innerHTML = '';
      var shown = 0;
      (DATA.quickCommands || []).forEach(function (grp) {
        var rows = grp.rows.filter(function (r) {
          return !q || (r[0] + ' ' + r[1] + ' ' + grp.group).toLowerCase().indexOf(q) >= 0;
        });
        if (!rows.length) return;
        shown += rows.length;
        var sec = el('div', 'qc');
        sec.appendChild(el('h3', '', esc(grp.group)));
        var tw = el('div', 'tablewrap');
        var t = document.createElement('table');
        var tb = document.createElement('tbody');
        rows.forEach(function (r) {
          var tr = document.createElement('tr');
          var td1 = document.createElement('td');
          td1.innerHTML = notate(r[0]);
          var td2 = document.createElement('td');
          td2.className = 'gesture';
          td2.innerHTML = notate(r[1]);
          tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
        });
        t.appendChild(tb); tw.appendChild(t); sec.appendChild(tw);
        if (grp.note && !q) sec.appendChild(el('p', 'qc__note', notate(grp.note)));
        results.appendChild(sec);
      });
      n.textContent = shown + (shown === 1 ? ' command' : ' commands');
      if (!shown) results.appendChild(el('p', 'empty', 'Nothing matches “' + esc(input.value) + '”.'));
    }

    input.addEventListener('input', draw);
    draw();
    input.focus();
  }

  /* -------------------------------------------------------------- recipes */

  /* Recipes carry a `group` so the panel can be narrowed to genres, rig
     patches, the FL Studio guide and so on. Entries start collapsed: with
     thirty-odd of them, a scannable index beats a wall of instructions. */

  var RECIPE_GROUPS = [
    { id: 'all',        label: 'Everything' },
    { id: 'genres',     label: 'Genres' },
    { id: 'polyrhythm', label: 'Weird & polyrhythmic' },
    { id: 'modes',      label: 'CC, FX & Hold' },
    { id: 'rig',        label: 'Your rig' },
    { id: 'fl',         label: 'FL Studio' },
    { id: 'craft',      label: 'Craft' }
  ];

  function recipeText(r) {
    return [r.title, r.for, r.why, r.bpm, r.warn, (r.gear || []).join(' '),
      (r.setup || []).join(' '), (r.build || []).join(' '), (r.perform || []).join(' '),
      (r.tracks || []).map(function (t) { return t.t + ' ' + t.d; }).join(' ')]
      .join(' ').toLowerCase();
  }

  function listSection(title, items, ordered) {
    var sec = el('div', '');
    sec.appendChild(el('h4', '', title));
    var tag = ordered ? 'ol' : 'ul';
    sec.insertAdjacentHTML('beforeend', '<' + tag + '>' +
      items.map(function (x) { return '<li>' + notate(x) + '</li>'; }).join('') + '</' + tag + '>');
    return sec;
  }

  function recipeBody(r) {
    var cols = el('div', 'recipe__cols');

    if (r.why) {
      var w = el('div', '');
      w.appendChild(el('h4', '', 'The idea'));
      w.appendChild(el('p', 'recipe__why', notate(r.why)));
      cols.appendChild(w);
    }

    if (r.setup && r.setup.length) cols.appendChild(listSection('Set up', r.setup, true));

    if (r.tracks && r.tracks.length) {
      var tSec = el('div', '');
      tSec.appendChild(el('h4', '', 'Track sheet'));
      var ul = el('ul', 'recipe__tracks');
      r.tracks.forEach(function (t) {
        ul.insertAdjacentHTML('beforeend',
          '<li><b>' + esc(t.t) + '</b><span>' + notate(t.d) + '</span></li>');
      });
      tSec.appendChild(ul);
      cols.appendChild(tSec);
    }

    if (r.widget) {
      var wg = W.build(r.widget);
      if (wg) { cols.appendChild(wg); if (wg.destroy) liveWidgets.push(wg); }
    }

    if (r.build && r.build.length) cols.appendChild(listSection('Build it', r.build, true));
    if (r.perform && r.perform.length) cols.appendChild(listSection('Play with it', r.perform, false));

    if (r.warn) {
      var g = el('div', 'gotcha');
      g.appendChild(el('h4', '', 'Watch out'));
      g.appendChild(el('p', '', notate(r.warn)));
      cols.appendChild(g);
    }
    return cols;
  }

  function renderRecipes(host) {
    var head = el('div', 'panelhead');
    head.appendChild(el('div', 'eyebrow', 'Beyond the checklist'));
    head.appendChild(el('h2', '', 'Recipes'));
    head.appendChild(el('p', '',
      'Genre builds, polyrhythmic oddities, creative uses of the CC and FX modes, patches for the ' +
      'gear on your desk, and an FL Studio guide. Nothing here is checked off \u2014 it is for playing.'));
    host.appendChild(head);

    var all = DATA.recipes || [];
    var group = state.recipeGroup || 'all';

    var chips = el('div', 'chips');
    chips.setAttribute('role', 'tablist');
    chips.setAttribute('aria-label', 'Recipe groups');
    RECIPE_GROUPS.forEach(function (g) {
      var n = g.id === 'all' ? all.length : all.filter(function (r) { return r.group === g.id; }).length;
      if (!n) return;
      var b = el('button', 'chipbtn' + (group === g.id ? ' is-on' : ''),
        esc(g.label) + ' <span class="chipbtn__n">' + n + '</span>');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', group === g.id ? 'true' : 'false');
      b.addEventListener('click', function () { state.recipeGroup = g.id; render(); });
      chips.appendChild(b);
    });
    host.appendChild(chips);

    var filter = el('div', 'filter');
    var input = document.createElement('input');
    input.type = 'search';
    input.id = 'recipe-filter';
    input.value = state.recipeQuery || '';
    input.placeholder = 'Filter \u2014 try "digitakt", "174", "wobble", "cycles", "eurorack"';
    input.setAttribute('aria-label', 'Filter recipes');
    var count = el('span', 'filter__n');
    filter.appendChild(input);
    filter.appendChild(count);
    host.appendChild(filter);

    var list = el('div', 'recipes');
    host.appendChild(list);

    function draw() {
      state.recipeQuery = input.value;
      var q = input.value.trim().toLowerCase();
      var shown = all.filter(function (r) {
        return (group === 'all' || r.group === group) && (!q || recipeText(r).indexOf(q) >= 0);
      });
      liveWidgets.forEach(function (w) { try { w.destroy(); } catch (e) {} });
      liveWidgets = [];
      list.innerHTML = '';
      count.textContent = shown.length + (shown.length === 1 ? ' recipe' : ' recipes');

      if (!shown.length) {
        list.appendChild(el('p', 'empty', 'Nothing matches \u201c' + esc(input.value) + '\u201d in this group.'));
        return;
      }

      // A narrow result set reads better open than as a list of headings.
      var autoOpen = shown.length <= 2;

      shown.forEach(function (r) {
        var key = r.id || r.title;
        var open = autoOpen || !!state.openRecipes[key];
        var box = el('article', 'recipe' + (open ? ' is-open' : ''));
        box.id = 'recipe-' + key;

        var hd = el('button', 'recipe__head');
        hd.type = 'button';
        hd.setAttribute('aria-expanded', open ? 'true' : 'false');
        var groupLabel = '';
        RECIPE_GROUPS.forEach(function (g) { if (g.id === r.group) groupLabel = g.label; });
        var meta = '<span class="recipe__n">' + esc(groupLabel) + '</span>';
        if (r.bpm) meta += '<span class="recipe__bpm">' + esc(r.bpm) + '</span>';
        (r.gear || []).forEach(function (g) { meta += '<span class="recipe__gear">' + esc(g) + '</span>'; });
        hd.innerHTML =
          '<span class="recipe__meta">' + meta + '</span>' +
          '<span class="recipe__title">' + esc(r.title) + '</span>' +
          '<span class="recipe__for">' + notate(r.for) + '</span>' +
          '<span class="recipe__caret" aria-hidden="true">' + (open ? '\u2212' : '+') + '</span>';
        hd.addEventListener('click', function () {
          state.openRecipes[key] = !open;
          draw();
        });
        box.appendChild(hd);

        if (open) box.appendChild(recipeBody(r));
        list.appendChild(box);
      });
    }

    input.addEventListener('input', draw);
    draw();
  }

  /* --------------------------------------------------------------- search */

  function renderSearch(host) {
    var head = el('div', 'panelhead');
    head.appendChild(el('div', 'eyebrow', 'Find'));
    head.appendChild(el('h2', '', 'Search the course'));
    host.appendChild(head);

    var filter = el('div', 'filter');
    var input = document.createElement('input');
    input.type = 'search';
    input.id = 'course-search';
    input.value = state.query;
    input.placeholder = 'Search every item and lesson — "rotate", "probability", "tail"…';
    input.setAttribute('aria-label', 'Search the course');
    var n = el('span', 'filter__n');
    filter.appendChild(input);
    filter.appendChild(n);
    host.appendChild(filter);

    var results = el('div', '');
    host.appendChild(results);

    function blob(item) {
      var L = item.lesson || {};
      return [item.title, item.summary, item.gesture, L.why, L.gesture, L.hear, L.musical, L.gotcha,
      (L.doThis || []).join(' '), (L.changeOne || []).join(' ')].join(' ').toLowerCase();
    }

    function draw() {
      state.query = input.value;
      var q = input.value.trim().toLowerCase();
      results.innerHTML = '';
      if (!q) {
        n.textContent = '';
        results.appendChild(el('p', 'empty', 'Type to search titles, gestures and lesson text.'));
        return;
      }
      var hits = [];
      DATA.units.forEach(function (u) {
        (u.items || []).forEach(function (it) {
          if (blob(it).indexOf(q) >= 0) hits.push({ u: u, it: it });
        });
      });
      n.textContent = hits.length + (hits.length === 1 ? ' result' : ' results');
      if (!hits.length) {
        results.appendChild(el('p', 'empty', 'Nothing matches “' + esc(input.value) + '”.'));
        return;
      }
      hits.forEach(function (h) {
        var b = el('button', 'hit',
          '<span class="hit__u">' + esc(h.u.short || h.u.title) + '</span>' +
          '<span class="hit__t">' + notate(h.it.title) + '</span>' +
          '<span class="hit__s">' + notate(h.it.summary) + '</span>');
        b.type = 'button';
        b.addEventListener('click', function () {
          state.view = 'unit';
          state.unitId = h.u.id;
          state.openLesson = h.it.id;
          render();
          scrollToItem(h.it.id);
        });
        results.appendChild(b);
      });
    }

    input.addEventListener('input', draw);
    draw();
    input.focus();
  }

  /* --------------------------------------------------------- import/export */

  function exportProgress() {
    var payload = JSON.stringify({ v: 1, app: 't1-practice-coach', progress: state.progress,
      exported: new Date().toISOString() }, null, 2);
    // Downloads are blocked in the artifact sandbox, so show the text to copy instead.
    var scrim = el('div', 'modalscrim');
    var box = el('div', 'modal');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.appendChild(el('div', 'eyebrow', 'Progress'));
    box.appendChild(el('h3', 'modal__q', 'Copy your progress'));
    box.appendChild(el('p', 'modal__s',
      'Paste this into Import on your other copy of the app — the phone and the desktop keep ' +
      'separate progress.'));
    var ta = document.createElement('textarea');
    ta.id = 'export-json';
    ta.value = payload;
    ta.rows = 8;
    ta.readOnly = true;
    ta.style.cssText = 'width:100%;margin-top:14px;font:400 12px/1.5 var(--f-mono);' +
      'background:var(--panel-2);color:var(--text);border:1px solid var(--line);' +
      'border-radius:5px;padding:10px;resize:vertical';
    box.appendChild(ta);
    var acts = el('div', 'modal__acts');
    var copy = el('button', 'btn btn--accent', 'Copy to clipboard');
    copy.type = 'button';
    copy.addEventListener('click', function () {
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (!ok && navigator.clipboard) {
        navigator.clipboard.writeText(payload).then(function () { toast('Copied', 'green'); },
          function () { toast('Select the text and copy manually', 'amber'); });
      } else {
        toast(ok ? 'Copied' : 'Select the text and copy manually', ok ? 'green' : 'amber');
      }
    });
    var cl = el('button', 'btn btn--ghost', 'Close');
    cl.type = 'button';
    cl.addEventListener('click', closeModal);
    acts.appendChild(copy); acts.appendChild(cl);
    box.appendChild(acts);
    scrim.appendChild(box);
    scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) closeModal(); });
    lastFocus = document.activeElement;
    modalHost.innerHTML = '';
    modalHost.hidden = false;
    modalHost.appendChild(scrim);
    document.addEventListener('keydown', modalKeys);
    ta.focus();
  }

  function importProgress() {
    var scrim = el('div', 'modalscrim');
    var box = el('div', 'modal');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.appendChild(el('div', 'eyebrow', 'Progress'));
    box.appendChild(el('h3', 'modal__q', 'Paste exported progress'));
    box.appendChild(el('p', 'modal__s', 'This replaces the progress stored in this copy of the app.'));
    var ta = document.createElement('textarea');
    ta.id = 'import-json';
    ta.rows = 8;
    ta.placeholder = '{ "v": 1, "progress": { … } }';
    ta.style.cssText = 'width:100%;margin-top:14px;font:400 12px/1.5 var(--f-mono);' +
      'background:var(--panel-2);color:var(--text);border:1px solid var(--line);' +
      'border-radius:5px;padding:10px;resize:vertical';
    box.appendChild(ta);
    var acts = el('div', 'modal__acts');
    var go = el('button', 'btn btn--accent', 'Replace progress');
    go.type = 'button';
    go.addEventListener('click', function () {
      var parsed;
      try { parsed = JSON.parse(ta.value); } catch (e) { parsed = null; }
      if (!parsed || !parsed.progress || typeof parsed.progress !== 'object') {
        toast('That is not a progress export — paste the whole block including the braces', 'amber');
        return;
      }
      var clean = {};
      Object.keys(parsed.progress).forEach(function (k) {
        var v = parsed.progress[k];
        if (itemIndex[k] && v && (v.s === 'done' || v.s === 'work')) clean[k] = { s: v.s, at: v.at || '' };
      });
      state.progress = clean;
      save();
      closeModal();
      render();
      var o = overall();
      toast('Imported — ' + o.done + ' of ' + o.total + ' understood', 'green');
    });
    var cl = el('button', 'btn btn--ghost', 'Cancel');
    cl.type = 'button';
    cl.addEventListener('click', closeModal);
    acts.appendChild(go); acts.appendChild(cl);
    box.appendChild(acts);
    scrim.appendChild(box);
    scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) closeModal(); });
    lastFocus = document.activeElement;
    modalHost.innerHTML = '';
    modalHost.hidden = false;
    modalHost.appendChild(scrim);
    document.addEventListener('keydown', modalKeys);
    ta.focus();
  }

  /* ----------------------------------------------------------------- theme */

  function applyTheme(t, quiet) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    if (!quiet) save();
  }

  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    if (cur === 'light') applyTheme('dark');
    else if (cur === 'dark') applyTheme('light');
    else {
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(sysDark ? 'light' : 'dark');
    }
    render();
  }

  /* ----------------------------------------------------------------- shell */

  function closeRail() {
    rail.classList.remove('is-open');
    var s = document.getElementById('rail-scrim');
    if (s) s.remove();
  }

  function openRail() {
    rail.classList.add('is-open');
    var s = el('div', 'scrim');
    s.id = 'rail-scrim';
    s.addEventListener('click', closeRail);
    document.body.appendChild(s);
  }

  function renderTopbar(host) {
    host.innerHTML = '';

    var burger = el('button', 'tool railtoggle', 'Units');
    burger.type = 'button';
    burger.setAttribute('aria-label', 'Show units');
    burger.addEventListener('click', function () {
      if (rail.classList.contains('is-open')) closeRail(); else openRail();
    });
    host.appendChild(burger);

    var brand = el('div', 'brand',
      '<span class="brand__t1">T1</span>' +
      '<span class="brand__name">Practice Coach</span>' +
      '<span class="brand__sub">learn the sequencer with your hands on it</span>');
    host.appendChild(brand);

    function tool(label, view) {
      var b = el('button', 'tool' + (state.view === view ? ' is-on' : ''), label);
      b.type = 'button';
      b.setAttribute('aria-pressed', state.view === view ? 'true' : 'false');
      b.addEventListener('click', function () {
        state.view = state.view === view ? 'unit' : view;
        render();
        window.scrollTo({ top: 0 });
      });
      host.appendChild(b);
    }

    tool('Search', 'search');
    tool('Recipes', 'recipes');
    tool('Cheat sheet', 'cheatsheet');

    var th = el('button', 'tool', 'Theme');
    th.type = 'button';
    th.setAttribute('aria-label', 'Switch light and dark');
    th.addEventListener('click', toggleTheme);
    host.appendChild(th);
  }

  /* ---------------------------------------------------------------- render */

  function render() {
    liveWidgets.forEach(function (w) { try { w.destroy(); } catch (e) {} });
    liveWidgets = [];

    renderTopbar(document.getElementById('topbar'));
    renderRail();

    mainHost.innerHTML = '';
    var wrap = el('div', 'wrap');

    if (state.view === 'cheatsheet') renderCheatsheet(wrap);
    else if (state.view === 'recipes') renderRecipes(wrap);
    else if (state.view === 'search') renderSearch(wrap);
    else renderUnit(wrap);

    wrap.appendChild(el('footer', 'pagefoot',
      'T1 Practice Coach — an unofficial study guide for the Torso Electronics T1. ' +
      'Device behaviour, gestures and value ranges are taken from the official ' +
      '<a href="https://docs.torsoelectronics.com/t1/introduction/" target="_blank" rel="noopener">T1 user guide</a>; ' +
      'the teaching, exercises and musical suggestions are original. ' +
      'Progress is stored only in this browser.'));

    mainHost.appendChild(wrap);
  }

  /* ------------------------------------------------------------- screen on
     Following along at the machine means long stretches without touching the
     screen. Where the browser offers a screen wake lock, a toggle keeps the
     display on. The browser drops the lock whenever the page is hidden, so it
     is taken again each time the page comes back. */

  var wakeSupported = !!(navigator.wakeLock && navigator.wakeLock.request);
  var wakeLock = null;
  var awakeBtn = null;

  /* The button reports the lock actually held, not just the preference. */
  function paintAwake() {
    if (!awakeBtn) return;
    var on = state.awake && !!wakeLock;
    awakeBtn.textContent = on ? 'Screen stays on' : 'Keep screen on';
    awakeBtn.classList.toggle('is-on', on);
    awakeBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function takeWakeLock(onFail) {
    if (!wakeSupported || !state.awake || wakeLock || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; paintAwake(); });
      paintAwake();
    }, function () {
      wakeLock = null;
      paintAwake();
      if (onFail) onFail();
    });
  }

  function setAwake(on) {
    state.awake = on;
    save();
    if (on) {
      takeWakeLock(function () {
        state.awake = false;
        save();
        paintAwake();
        toast('This browser would not keep the screen on', 'amber');
      });
    } else if (wakeLock) {
      var lock = wakeLock;
      wakeLock = null;
      lock.release().catch(function () {});
    }
    paintAwake();
  }

  document.addEventListener('visibilitychange', function () { takeWakeLock(); });

  /* --------------------------------------------------------------- install
     Chrome and Samsung Internet offer to install a page that has a manifest
     and a service worker (the hosted tablet build). Keep the offer and show
     a button for it in the rail. */

  var installEvent = null;
  var installBtn = null;

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvent = e;
    if (installBtn) installBtn.hidden = false;
  });

  window.addEventListener('appinstalled', function () {
    installEvent = null;
    if (installBtn) installBtn.hidden = true;
    toast('Installed — open it from your home screen', 'green');
  });

  function installApp() {
    if (!installEvent) return;
    var ev = installEvent;
    installEvent = null;
    if (installBtn) installBtn.hidden = true;
    ev.prompt();
  }

  /* ------------------------------------------------------------------ boot */

  function boot() {
    var app = document.getElementById('app');
    app.innerHTML = '';

    var bar = el('div', 'topbar');
    bar.id = 'topbar';
    app.appendChild(bar);

    var shell = el('div', 'app');
    rail = el('nav', 'rail');
    rail.setAttribute('aria-label', 'Units');
    mainHost = el('main', 'main');
    shell.appendChild(rail);
    shell.appendChild(mainHost);
    app.appendChild(shell);

    modalHost = el('div', '');
    modalHost.hidden = true;
    document.body.appendChild(modalHost);

    toastHost = el('div', 'toasts');
    document.body.appendChild(toastHost);

    probeStorage();
    load();
    render();
    takeWakeLock();

    document.addEventListener('keydown', function (e) {
      if (!modalHost.hidden) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key === 'k')) {
        e.preventDefault();
        state.view = 'search';
        render();
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
